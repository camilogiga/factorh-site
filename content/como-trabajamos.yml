google:
  descripcion: 'Cómo trabaja Factor H: dos horas al mes de tu tiempo, aprobación por WhatsApp y un marco ético que cumple la Ley 23 de 1981.'
  titulo: Factor H, cómo trabajamos
tu_hablas_y:
  p_1: Cómo trabajamos
  h1_1: Tú hablas y apruebas. Nosotros hacemos el resto.
  p_2: Trabajamos como un colega que entiende la medicina y sus tiempos. Te pedimos unas dos horas al mes.
un_mes_tipico:
  h2_1: Un mes típico
  span_1: Semana 1
  strong_1: Reunión de 30 minutos
  span_2: Revisamos el mes anterior, tu agenda y los temas. La grabamos como materia prima.
  span_3: Semanas 1 y 2
  strong_2: Escribimos y editamos
  span_4: Te enviamos las piezas por WhatsApp para aprobar o pedir cambios.
  span_5: Semana 3
  strong_3: Segunda reunión
  span_6: Ajustes, ideas nuevas y próximos eventos.
  span_7: Todo el mes
  strong_4: Publicamos
  span_8: Respondemos comentarios y mensajes, y crecemos tu red.
  span_9: Fin de mes
  strong_5: Informe
  span_10: Un resumen corto con resultados y aprendizajes.
comunicar_con_impacto:
  p_1: Nuestro marco ético
  h2_1: Comunicar con impacto, sin poner en riesgo tu tarjeta profesional.
  p_2: 'Todo lo que publicamos cumple el Código de Ética Médica (Ley 23 de 1981), la Ley 1164 de 2007 y la Ley 1581 de 2012 de protección de datos. Para nosotros no es una restricción: es una garantía.'
  li_1: '**Hechos, no adjetivos.** Contamos lo que hiciste, dónde y qué aprendiste. Nunca "el mejor" ni "número uno".'
  li_2: '**Sin promesas de resultados.** Ni antes y después engañosos, ni precios como gancho.'
  li_3: '**Pacientes protegidos.** Ningún caso, imagen o testimonio de paciente sin autorización expresa y por escrito.'
  li_4: '**Divulgación, no publicidad.** Separamos la educación para pacientes de la promoción de servicios.'
  li_5: '**Tu aprobación, siempre.** Nada se publica sin tu visto bueno.'
  li_6: '**Confidencialidad.** Lo que nos cuentas queda entre tú y nosotros.'
seccion_3:
  p_1: Empieza por un Diagnóstico de tu presencia digital.
  a_1: Solicitar diagnóstico
