por_que_nos:
  aria_1: Símbolo de Factor H
  h2_1: Por qué nos llamamos Factor H
  p_1: 'El índice h mide el impacto de un investigador según cuántas veces citan sus trabajos. Cualquier médico con formación académica lo reconoce: es prestigio validado por pares.'
  p_2: 'Nuestro símbolo es esa gráfica: el tallo alto son los trabajos más citados, el tallo bajo es la curva que desciende y el cuadro ámbar es el punto h. Así entendemos nuestro oficio: confianza que se acumula con constancia y con respaldo.'
