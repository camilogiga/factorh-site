google:
  descripcion: Factor H es una firma colombiana de comunicaciones dedicada solo a la salud, fundada por Camilo Giraldo Gallo y Rina Díaz Sánchez.
  titulo: Factor H, nosotros
una_firma_de:
  p_1: Nosotros
  h1_1: Una firma de comunicaciones dedicada solo a la salud.
  p_2: Los pacientes eligen a su médico por confianza, y hoy esa confianza empieza en Google y en redes. Creamos Factor H para que los profesionales de la salud lleguen a los pacientes indicados, con la misma seriedad con la que tratan su práctica.
camilo_giraldo_gallo:
  foto_1: img/camilo-retrato.jpg
  alt_1: Camilo Giraldo Gallo, socio fundador de Factor H, sonríe con camisa de rayas.
  h2_1: Camilo Giraldo Gallo
  p_1: Socio fundador
  p_2: Consultor de comunicaciones con 15 años de trayectoria en Colombia y Estados Unidos. Magíster en Comunicación de Masas de la Universidad de la Florida y fundador de GO Global Media.
  foto_2: img/rina-endotour.jpg
  alt_2: Rina Díaz Sánchez, socia fundadora de Factor H, con el teléfono en la mano durante el Endotour 2026 de la ACED.
  h2_2: Rina Díaz Sánchez
  p_3: Socia fundadora
  p_4: Abogada, coach profesional y especialista con enfoque de género, con más de 15 años de experiencia en política pública, gobierno, tercer sector y comunicaciones.
dos_socios_un:
  foto_1: img/camilo-y-rina.jpg
  alt_1: Selfie de Camilo Giraldo Gallo y Rina Díaz Sánchez sonriendo durante un evento.
  h2_1: Dos socios, un mismo equipo.
  p_1: Cada proyecto lo trabajamos juntos, de la primera conversación a la publicación. Así sabes siempre con quién hablas.
nos_veras_en:
  p_1: En acción
  h2_1: Nos verás en el congreso y en el set de grabación.
  p_2: Hacemos cobertura en vivo de eventos médicos y producimos contenido en video y audio con especialistas.
  foto_1: img/accion-aced-podio.jpg
  alt_1: Rina Díaz Sánchez graba con su teléfono una conferencia en el Endotour 2026 de la ACED.
  figcaption_1: Cobertura del Endotour 2026, congreso de la Asociación Colombiana de Endoscopia Digestiva (ACED).
  foto_2: img/accion-aced-auditorio.jpg
  alt_2: Rina Díaz Sánchez graba de pie entre el público del auditorio del Endotour 2026.
  figcaption_2: Contenido para redes desde el auditorio del Endotour 2026.
  foto_3: img/accion-podcast-camara.jpg
  alt_3: Cámara en primer plano durante la grabación de un episodio de podcast con dos especialistas en un set.
  figcaption_3: Grabación del podcast de Asocoloprocto, la Asociación Colombiana de Coloproctología.
  foto_4: img/accion-podcast-set.jpg
  alt_4: Dos especialistas conversan en el set del podcast de Asocoloprocto mientras se registra el episodio.
  figcaption_4: En el set del podcast de Asocoloprocto.
foto_del_equipo:
  foto_1: img/rina-aro-de-luz.jpg
por_que_nos:
  aria_1: Símbolo de Factor H
  h2_1: Por qué nos llamamos Factor H
  p_1: 'El índice h mide el impacto de un investigador según cuántas veces citan sus trabajos. Cualquier médico con formación académica lo reconoce: es prestigio validado por pares.'
  p_2: 'Nuestro símbolo es esa gráfica: el tallo alto son los trabajos más citados, el tallo bajo es la curva que desciende y el cuadro ámbar es el punto h. Así entendemos nuestro oficio: confianza que se acumula con constancia y con respaldo.'
