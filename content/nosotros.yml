google:
  descripcion: Factor H es una firma colombiana de comunicaciones dedicada solo a la salud, fundada por Camilo Giraldo Gallo y Rina Díaz Sánchez.
  titulo: Factor H, nosotros
una_firma_de:
  p_1: Nosotros
  h1_1: Una firma de comunicaciones dedicada solo a la salud.
  p_2: Los pacientes eligen a su médico por confianza, y hoy esa confianza empieza en Google y en redes. Creamos Factor H para que los profesionales de la salud lleguen a los pacientes indicados, con la misma seriedad con la que tratan su práctica.
