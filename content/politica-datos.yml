  descripcion: Política de tratamiento de datos personales de Factor H Comunicaciones S.A.S.
  titulo: Factor H, política de datos
politica_de_tratamiento:
  p_1: Legal
  h1_1: Política de tratamiento de datos personales
  p_2: 'Última actualización: noviembre de 2026.'
  h2_1: 1. Responsable del tratamiento
  p_3: 'Factor H Comunicaciones S.A.S., con domicilio en Colombia. Correo de contacto:'
  p_4: .
  h2_2: 2. Datos que recogemos
  p_5: 'Por medio de este sitio recogemos los datos que tú nos das en el formulario de contacto: nombre, especialidad o entidad, ciudad, correo, teléfono y el mensaje que nos escribas. De nuestros clientes tratamos además los datos profesionales necesarios para prestar el servicio.'
  h2_3: 3. Finalidades
  p_6: Usamos tus datos para responder tu solicitud, agendar conversaciones, preparar propuestas, prestar los servicios contratados y, solo si lo autorizas, enviarte información de Factor H. No vendemos ni cedemos tus datos a terceros.
  h2_4: 4. Datos sensibles
  p_7: Este sitio no recoge datos de salud de pacientes. Ningún caso, imagen o testimonio de paciente se publica sin su autorización expresa y por escrito.
  h2_5: 5. Tus derechos
  p_8: Como titular de los datos puedes conocerlos, actualizarlos, rectificarlos, pedir su supresión, revocar la autorización y pedir prueba de ella, según la Ley 1581 de 2012 y el Decreto 1377 de 2013. También puedes presentar quejas ante la Superintendencia de Industria y Comercio.
  h2_6: 6. Cómo ejercerlos
  p_9: Escríbenos a
  p_10: indicando tu nombre, tu solicitud y un dato de contacto. Respondemos las consultas en máximo diez días hábiles y los reclamos en máximo quince días hábiles, como lo establece la ley.
  h2_7: 7. Vigencia
  p_11: Esta política rige desde su publicación. Conservamos los datos mientras dure la relación y por el tiempo que exijan las obligaciones legales. Cualquier cambio se publicará en esta página.
